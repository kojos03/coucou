<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><title>Coucou Phase 1 check</title></head>
<body>
<div id="settings-root"></div>
<script type="module">
  import { Bridge } from "../src/core/bridge.ts";
  import { State } from "../src/core/state.ts";
  Bridge.boot = async () => null;
  Bridge.hooksStatus = async () => ({ installed: false, settingsPath: "", hookPath: "", hookReady: false });
  Bridge.secretPresent = async () => false;
  Bridge.codexHooksStatus = async () => ({
    path: "C:\\Users\\you\\.codex\\hooks.json", exists: true, problem: null,
    hookPath: "C:\\Users\\you\\AppData\\Local\\Coucou\\bin\\coucou-hook.exe", hookReady: true,
    events: ["SessionStart", "UserPromptSubmit", "PreToolUse", "PostToolUse", "SubagentStart", "SubagentStop", "Stop", "SessionEnd"]
      .map((event) => ({ event, state: "ok" })),
    installed: true, anyInstalled: true, lastEvent: Math.round(Date.now() / 1000) - 180,
  });
  Bridge.openSettingsWindow = async () => { location.search = "?settings"; };
  Bridge.chatSend = async (provider) => { throw {
    code: "missing_key", settings: true,
    message: provider === "openai"
      ? "Codex's Mochi needs an OpenAI API key. Add one in Codex's Mochi settings. Your Codex or ChatGPT sign-in does not set up this chat."
      : "Claude's Mochi needs an Anthropic API key. Add one in Claude's Mochi settings. Your Claude Code or Codex sign-in does not set up this chat.",
  }; };
  if (location.search) {
    document.body.className = "settings-window";
    await import("../src/settings/main.ts");
  } else {
    await import("../src/style.css");
    const { buildViews } = await import("../src/views/views.ts");
    document.body.style.cssText = "background:#202126;overflow:auto;padding:30px;color:white";
    document.getElementById("settings-root").remove();
    const controls = document.createElement("div");
    controls.style.cssText = "display:flex;gap:16px;margin-bottom:20px";
    const stage = document.createElement("div");
    stage.style.cssText = "position:relative;width:608px;height:188px";
    document.body.append(controls, stage);
    State.loadIntegrationTasks();
    State.mode = "expanded";
    State.view = "prompt";
    const task = State.tasks.find(t => t.id === "agent_codex");
    task.steps = ["Phase 1 check complete"];
    task.state = "finished";
    State.setFocus(task.id);
    let current;
    const actions = new Proxy({}, { get: () => () => {} });
    const views = buildViews(actions, () => {});
    State.subscribe(() => current?.sync());
    for (const [label, key] of [["Chat error check", "prompt"], ["Finished card", "finished"]]) {
      const button = document.createElement("button");
      button.textContent = label;
      button.onclick = () => {
        current = views.get(key);
        stage.replaceChildren(current.el);
        current.el.classList.add("on");
        stage.style.height = key === "finished" ? "100px" : "188px";
        current.sync();
      };
      controls.append(button);
    }
    controls.firstElementChild.click();
  }
</script>
</body></html>
